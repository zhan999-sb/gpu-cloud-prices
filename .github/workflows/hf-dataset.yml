name: HF dataset snapshot

on:
  schedule:
    - cron: '40 1 * * *'   # daily, after the morning price refreshes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned publisher dependencies
        run: python -m pip install --disable-pip-version-check huggingface_hub==0.36.0 pyarrow==22.0.0
      - name: Publish the daily open-data snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/hf_dataset_publish.py --repo ComputeTicks/gpu-cloud-prices
