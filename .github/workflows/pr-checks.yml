name: GPU PR checks

on:
  push:
    # The data branch contains no source code and must not run source tests.
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gpu-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Check shell syntax and run offline tests
        run: |
          mkdir -p ci/runtime
          for script in ci/*.sh; do bash -n "$script"; done
          python -m pytest tests/test_gpu_*.py -q -p no:cacheprovider --basetemp ci/runtime/pipeline-tests
          python -m unittest discover -s ci/tests -v
